# Builds the Android app (APK) on every push.
# Download it from the workflow run's "Artifacts" section, or push a tag like
# v1.0.0 to publish it on the repository's Releases page.
name: Android app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install build tools
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Copy the web app into the Android project
        run: npm run android:sync

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk late-night-safety.apk

      - uses: actions/upload-artifact@v6
        with:
          name: late-night-safety-apk
          path: late-night-safety.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: late-night-safety-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" late-night-safety.apk --repo "$GITHUB_REPOSITORY" --title "Late Night Safety $GITHUB_REF_NAME" --generate-notes
